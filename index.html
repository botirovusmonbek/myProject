<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOTIROV ANIMATSIYA // STUDIO EDITION</title>
   
    <!-- Google Fonts: Cinzel, Space Grotesk, JetBrains Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
   
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        luxury: ['Cinzel', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Ultra-Refined Obsidian Glassmorphism & Pro Studio Styles -->
    <style>
        :root {
            --accent-primary: #f59e0b;
            --accent-secondary: #fde047;
            --accent-tertiary: #ffffff;
            --accent-glow: rgba(245, 158, 11, 0.45);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030306;
            color: #f8fafc;
            user-select: none;
        }

        /* Cinematic Film Grain Overlay */
        .film-grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 45;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Volumetric Ambient Spotlight */
        .ambient-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle at 50% 44%, var(--accent-glow) 0%, rgba(3, 3, 6, 0) 68%);
            transition: background 0.9s ease;
            opacity: 0.4;
        }

        /* Obsidian Glass Panel */
        .obsidian-glass {
            background: rgba(9, 10, 16, 0.72);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 55px -12px rgba(0, 0, 0, 0.92), inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
        }

        .mode-pill {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mode-pill:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-1px);
        }

        .mode-pill.active {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04));
            border-color: var(--accent-primary);
            box-shadow: 0 0 22px -4px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        /* Custom Range Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 999px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-secondary);
            border: 2px solid #050508;
            box-shadow: 0 0 12px var(--accent-primary);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        /* Luxury Input Border Gradient */
        .luxury-input-ring {
            position: relative;
            border-radius: 1rem;
            padding: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.1), var(--accent-primary), rgba(255,255,255,0.1));
            transition: all 0.35s ease;
        }

        .luxury-input-ring:focus-within {
            box-shadow: 0 0 32px -4px var(--accent-glow);
        }

        /* Shimmering Primary Action Button */
        .btn-shimmer {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #040406;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 45%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            transform: rotate(25deg);
            transition: left 0.6s ease;
        }

        .btn-shimmer:hover::after {
            left: 130%;
        }

        .btn-shimmer:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -5px var(--accent-glow);
        }

        .btn-shimmer:active {
            transform: scale(0.97);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes toastDrop {
            0% { opacity: 0; transform: translate(-50%, -18px) scale(0.94); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        .toast-active {
            animation: toastDrop 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes recPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .rec-dot {
            animation: recPulse 1s infinite;
        }
    </style>
</head>
<body class="antialiased selection:bg-amber-500/30 selection:text-amber-200">

    <!-- Volumetric Lighting & Film Grain Layers -->
    <div id="ambientGlow" class="ambient-glow"></div>
    <div class="film-grain"></div>

    <!-- Main 60+ FPS Interactive Multi-Layer Canvas -->
    <canvas id="kineticCanvas" class="fixed inset-0 w-full h-full z-10 cursor-crosshair"></canvas>

    <!-- Floating Toast Notification -->
    <div id="toastBox" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none hidden">
        <div class="obsidian-glass px-5 py-2.5 rounded-full flex items-center gap-2.5 text-xs sm:text-sm font-medium text-white shadow-2xl border border-white/15">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span id="toastText">Tayyor!</span>
        </div>
    </div>

    <!-- Top Studio Header Bar -->
    <header id="topHeader" class="fixed top-0 inset-x-0 z-30 px-3.5 py-3 sm:px-7 sm:py-4 flex items-center justify-between pointer-events-none transition-all duration-500">
        <!-- Custom Geometric Branding Badge -->
        <div class="pointer-events-auto flex items-center gap-3 obsidian-glass px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-2xl">
            <div class="relative w-9 h-9 rounded-xl flex items-center justify-center shadow-lg shrink-0" style="background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));">
                <!-- Geometric Vector Crest -->
                <svg class="w-5 h-5 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                    <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"/>
                    <polyline points="12 22 12 12 21 7"/>
                    <line x1="12" y1="12" x2="3" y2="7"/>
                </svg>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="font-display font-bold tracking-wider text-xs sm:text-sm md:text-base text-white">
                        BOTIROV ANIMATSIYA
                    </h1>
                    <span class="hidden sm:inline-block px-1.5 py-0.5 text-[9px] font-mono font-bold tracking-widest uppercase rounded bg-white/10 text-amber-300 border border-amber-400/30">
                        STUDIO EDITION
                    </span>
                </div>
                <p class="text-[10px] font-mono uppercase tracking-widest text-white/45 hidden sm:block">
                    Volumetric 3D Kinetic & Curl-Noise Engine
                </p>
            </div>
        </div>

        <!-- Telemetry & Cinema / Export Controls -->
        <div class="pointer-events-auto flex items-center gap-1.5 sm:gap-2.5">
            <!-- Live Telemetry Pill -->
            <div class="hidden xl:flex items-center gap-3 obsidian-glass px-3.5 py-2.5 rounded-2xl font-mono text-[11px] text-white/60">
                <span class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
                    <strong id="fpsCounter" class="text-white">60</strong> FPS
                </span>
                <span class="text-white/15">|</span>
                <span>ZARRALAR: <strong id="particleCount" class="text-white">0</strong></span>
                <span class="text-white/15">|</span>
                <span>BEAT: <strong id="beatLevel" class="text-amber-300">0%</strong></span>
            </div>

            <!-- Studio Sandbox Drawer Toggle -->
            <button id="toggleSandboxBtn" title="Fizika va Rejimlar Paneli" class="obsidian-glass px-3 py-2.5 sm:px-3.5 rounded-2xl text-white/85 hover:text-white transition flex items-center gap-2 text-xs font-medium cursor-pointer border border-white/10 hover:border-white/25">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
                </svg>
                <span class="hidden md:inline">Fizika Studio</span>
            </button>

            <!-- Web Audio Synthesizer Toggle -->
            <button id="soundToggleBtn" title="Sintezator ovozi" class="obsidian-glass p-2.5 sm:px-3 rounded-2xl text-white/80 hover:text-white transition flex items-center gap-1.5 text-xs font-medium cursor-pointer">
                <svg id="soundIconOn" class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                </svg>
                <svg id="soundIconOff" class="w-4 h-4 text-white/40 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                </svg>
            </button>

            <!-- 5-Second WebM Video Recorder -->
            <button id="recordVideoBtn" title="5 soniyalik WebM video yozish" class="obsidian-glass p-2.5 sm:px-3.5 rounded-2xl text-white/85 hover:text-white transition flex items-center gap-2 text-xs font-medium cursor-pointer">
                <span id="recIndicator" class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                <span id="recBtnLabel" class="hidden sm:inline">WebM Video</span>
            </button>

            <!-- 4K PNG Download -->
            <button id="screenshotBtn" title="4K PNG rasm yuklab olish" class="obsidian-glass p-2.5 sm:px-3.5 rounded-2xl text-white/85 hover:text-white transition flex items-center gap-1.5 text-xs font-medium cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span class="hidden sm:inline">4K PNG</span>
            </button>

            <!-- Cinema Mode Toggle (Hotkey: H) -->
            <button id="cinemaModeBtn" title="Kinoteatr rejimi (Tugma: H)" class="obsidian-glass p-2.5 rounded-2xl text-white/75 hover:text-white transition cursor-pointer">
                <svg id="eyeOpenIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                <svg id="eyeClosedIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Collapsible Pro Studio Physics Sandbox Drawer (Right Side) -->
    <aside id="studioDrawer" class="fixed top-20 right-3.5 sm:right-7 z-30 w-72 sm:w-80 obsidian-glass rounded-3xl p-4 sm:p-5 transition-all duration-400 translate-x-[120%] opacity-0 pointer-events-none flex flex-col gap-4 max-h-[calc(100vh-14rem)] overflow-y-auto no-scrollbar">
        <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
            <span class="font-display font-bold text-xs uppercase tracking-widest text-white flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                Fizika & Interaktiv Studio
            </span>
            <button id="closeSandboxBtn" class="text-white/50 hover:text-white p-1 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Mouse / Touch Force Mode Selector -->
        <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-mono uppercase tracking-wider text-white/50">Sichqoncha / Barmoq Kuchi:</label>
            <div class="grid grid-cols-3 gap-1.5" id="forceModeGroup">
                <button data-force="repel" class="force-btn mode-pill active py-2 px-2 rounded-xl text-[11px] font-medium text-center cursor-pointer">
                    💥 Portlash
                </button>
                <button data-force="attract" class="force-btn mode-pill py-2 px-2 rounded-xl text-[11px] font-medium text-white/70 text-center cursor-pointer">
                    🧲 Magnit
                </button>
                <button data-force="laser" class="force-btn mode-pill py-2 px-2 rounded-xl text-[11px] font-medium text-white/70 text-center cursor-pointer">
                    ⚡ Lazer
                </button>
            </div>
        </div>

        <!-- Audio Source Selector (for Musiqa Reaktori) -->
        <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-mono uppercase tracking-wider text-white/50">Musiqa Reaktori Manbasi:</label>
            <div class="grid grid-cols-2 gap-1.5">
                <button id="synthBeatBtn" class="mode-pill active py-1.5 px-2.5 rounded-xl text-[11px] font-medium cursor-pointer">
                    🎹 Sintezator Beat
                </button>
                <button id="micReactBtn" class="mode-pill py-1.5 px-2.5 rounded-xl text-[11px] font-medium text-white/75 cursor-pointer">
                    🎙️ Jonli Mikrofon
                </button>
            </div>
        </div>

        <!-- Real-time Physics Sliders -->
        <div class="flex flex-col gap-3">
            <!-- Density -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-[11px]">
                    <span class="text-white/70">Zarralar Soni (Zichlik)</span>
                    <span id="densityVal" class="font-mono text-amber-300">Yuqori</span>
                </div>
                <input type="range" id="densitySlider" min="1" max="3" step="1" value="2">
            </div>

            <!-- Spring Tension -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-[11px]">
                    <span class="text-white/70">Fizika Tezligi (Prujina)</span>
                    <span id="springVal" class="font-mono text-amber-300">1.0x</span>
                </div>
                <input type="range" id="springSlider" min="0.4" max="2.0" step="0.1" value="1.0">
            </div>

            <!-- Bloom / Glow Intensity -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-[11px]">
                    <span class="text-white/70">Nur Yorqinligi (Bloom)</span>
                    <span id="glowVal" class="font-mono text-amber-300">100%</span>
                </div>
                <input type="range" id="glowSlider" min="0.3" max="2.0" step="0.1" value="1.0">
            </div>

            <!-- 3D Auto-Orbit / Tilt -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-[11px]">
                    <span class="text-white/70">3D Avto-Aylanish</span>
                    <span id="orbitVal" class="font-mono text-amber-300">O'chiq</span>
                </div>
                <input type="range" id="orbitSlider" min="0" max="2" step="0.2" value="0">
            </div>
        </div>

        <!-- 6 Curated Luxury Color Palettes -->
        <div class="flex flex-col gap-2 pt-1 border-t border-white/10">
            <span class="text-[10px] font-mono uppercase tracking-wider text-white/50">6 Hashamatli Rang Palitrasi:</span>
            <div class="grid grid-cols-3 gap-1.5" id="paletteGrid">
                <button data-theme="gold" class="theme-btn mode-pill active py-1.5 px-2 rounded-xl text-[10px] font-medium flex items-center gap-1.5 cursor-pointer">
                    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background: linear-gradient(135deg,#f59e0b,#fde047)"></span> Oltin
                </button>
                <button data-theme="cyber" class="theme-btn mode-pill py-1.5 px-2 rounded-xl text-[10px] font-medium text-white/75 flex items-center gap-1.5 cursor-pointer">
                    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background: linear-gradient(135deg,#06b6d4,#818cf8)"></span> Kiber
                </button>
                <button data-theme="emerald" class="theme-btn mode-pill py-1.5 px-2 rounded-xl text-[10px] font-medium text-white/75 flex items-center gap-1.5 cursor-pointer">
                    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background: linear-gradient(135deg,#10b981,#a3e635)"></span> Zumrad
                </button>
                <button data-theme="royal" class="theme-btn mode-pill py-1.5 px-2 rounded-xl text-[10px] font-medium text-white/75 flex items-center gap-1.5 cursor-pointer">
                    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background: linear-gradient(135deg,#a855f7,#ec4899)"></span> Qirollik
                </button>
                <button data-theme="supernova" class="theme-btn mode-pill py-1.5 px-2 rounded-xl text-[10px] font-medium text-white/75 flex items-center gap-1.5 cursor-pointer">
                    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background: linear-gradient(135deg,#f43f5e,#fb923c)"></span> Olovli
                </button>
                <button data-theme="ice" class="theme-btn mode-pill py-1.5 px-2 rounded-xl text-[10px] font-medium text-white/75 flex items-center gap-1.5 cursor-pointer">
                    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background: linear-gradient(135deg,#38bdf8,#e0f2fe)"></span> Muzli
                </button>
            </div>
        </div>
    </aside>

    <!-- Bottom Studio Command Deck -->
    <main id="bottomDeck" class="fixed bottom-3 sm:bottom-6 inset-x-0 z-30 px-3 sm:px-6 flex justify-center transition-all duration-500">
        <div class="obsidian-glass w-full max-w-5xl rounded-3xl p-3 sm:p-4 flex flex-col gap-3">
           
            <!-- 8 Master-Class Animation Modes Carousel -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5" id="modesContainer">
                <button data-mode="supernova" class="mode-btn mode-pill active px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-medium whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
                    <span>💥</span> Supernova Portlash
                </button>
                <button data-mode="cyber" class="mode-btn mode-pill px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-white/75 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
                    <span>⚡</span> Kiber-Kvant Tarmoq
                </button>
                <button data-mode="gold" class="mode-btn mode-pill px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-white/75 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
                    <span>👑</span> Suyuq Oltin va Olov
                </button>
                <button data-mode="galaxy" class="mode-btn mode-pill px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-white/75 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
                    <span>🌌</span> Galaktika Vorteksi
                </button>
                <button data-mode="hologram" class="mode-btn mode-pill px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-white/75 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
                    <span>🧬</span> Golografik Matritsa 3D
                </button>
                <button data-mode="crystal" class="mode-btn mode-pill px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-white/75 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
                    <span>💎</span> Kristall Prizma
                </button>
                <button data-mode="music" class="mode-btn mode-pill px-3 py-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-white/75 whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
                    <span>🎵</span> Musiqa Reaktori

            // Fast Pseudo-2D Curl Noise Field for Organic Fluid & Smoke Turbulence
            function curlNoise(x, y, t) {
                const eps = 0.01;
                const n1 = Math.sin(x * 0.008 + t) * Math.cos(y * 0.008 - t * 0.8);
                const n2 = Math.cos((x + eps) * 0.008 + t) * Math.sin((y - eps) * 0.008 + t * 0.7);
                return {
                    vx: (n2 - n1) * 140,
                    vy: -(n1 + n2) * 0.9
                };
            }

            // Procedural Web Audio API Synthesizer & Live Mic Analyzer
            class StudioAudioEngine {
                constructor() {
                    this.ctx = null;
                    this.droneOsc = null;
                    this.droneGain = null;
                    this.beatInterval = null;
                }

                init() {
                    if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                }

                playShockwaveBoom() {
                    if (!state.audio.enabled) return;
                    try {
                        this.init();
                        if (!this.ctx) return;
                        const now = this.ctx.currentTime;

                        // Sub-bass cinematic impact
                        const sub = this.ctx.createOscillator();
                        const subGain = this.ctx.createGain();
                        sub.type = 'sine';
                        sub.frequency.setValueAtTime(155, now);
                        sub.frequency.exponentialRampToValueAtTime(32, now + 0.75);

                        subGain.gain.setValueAtTime(0.32, now);
                        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

                        sub.connect(subGain);
                        subGain.connect(this.ctx.destination);
                        sub.start(now);
                        sub.stop(now + 0.82);

                        // Crystalline harmonic shimmer
                        const shimmer = this.ctx.createOscillator();
                        const shimGain = this.ctx.createGain();
                        shimmer.type = 'triangle';
                        shimmer.frequency.setValueAtTime(440, now);
                        shimmer.frequency.exponentialRampToValueAtTime(1320, now + 0.5);

                        shimGain.gain.setValueAtTime(0.08, now);
                        shimGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

                        shimmer.connect(shimGain);
                        shimGain.connect(this.ctx.destination);
                        shimmer.start(now);
                        shimmer.stop(now + 0.56);
                    } catch (e) {}
                }

                        this.init();
                        if (!this.ctx) return;
                        const now = this.ctx.currentTime;
                        const freqs = [523.25, 659.25, 783.99, 1046.5];

                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, now);
                        osc.frequency.exponentialRampToValueAtTime(f * 1.25, now + 0.18);

                        gain.gain.setValueAtTime(0.06, now);

                        osc.connect(gain);

            // Apply Luxury Palette

            // Core 3D Volumetric Particle Class
            class VolumetricParticle {
                constructor(tx, ty, tz, index) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * Math.max(state.width, state.height) * 0.8 + 150;

                    this.x = state.width / 2 + Math.cos(angle) * radius;
                    this.y = state.height / 2 + Math.sin(angle) * radius;
                    this.z = (Math.random() - 0.5) * 900;

                    this.targetX = tx;
                    this.targetY = ty;
                    this.targetZ = tz;

                    this.vx = (Math.random() - 0.5) * 24;
                    this.vy = (Math.random() - 0.5) * 24;
                    this.vz = (Math.random() - 0.5) * 18;

                    this.baseSize = Math.random() * 2.0 + 1.05;
                    this.baseSpring = 0.042 + Math.random() * 0.032;
                    this.friction = 0.83 + Math.random() * 0.05;
                    this.phase = Math.random() * Math.PI * 2;
                    this.orbitAngle = Math.atan2(ty - state.height * 0.44, tx - state.width / 2);
                    this.glyph = String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96));
                    this.prismAngle = Math.random() * Math.PI * 2;
                    this.energy = Math.random();

                    this.assignColor(THEMES[state.theme], index);
                }

                assignColor(themeObj, idx = 0) {
                    if (state.mode === 'crystal') {
                        this.color = themeObj.prism[idx % themeObj.prism.length];
                        return;
                    }
                    const r = Math.random();
                    if (r < 0.52) this.color = themeObj.primary;
                    else if (r < 0.88) this.color = themeObj.secondary;
                    else this.color = themeObj.tertiary;
                }

                impulse(ox, oy, power = 28, inward = false) {
                    const dx = this.x - ox;
                    const dy = this.y - oy;
                    const dist = Math.hypot(dx, dy) || 1;
                    const dir = inward ? -1 : 1;
                    const force = (Math.random() * 0.6 + 0.5) * power * dir;
                    this.vx += (dx / dist) * force + (Math.random() - 0.5) * 12;
                    this.vy += (dy / dist) * force + (Math.random() - 0.5) * 12;
                    this.vz += (Math.random() - 0.5) * power * 1.8;
                }

                update(time, mouse, tilt, beat) {
                    const cx = state.width / 2;
                    const cy = state.height * 0.44;
                    let relX = this.targetX - cx;
                    let relY = this.targetY - cy;
                    let zPos = this.targetZ;

                    // Mode-Specific 3D Target Deformations
                    if (state.mode === 'wave') {
                        // Quantum Liquid Silk harmonic wave
                        const wave = Math.sin(time * 3.2 + relX * 0.015 + this.phase * 0.3) * 28;
                        const waveY = Math.cos(time * 2.5 + relX * 0.012) * 12;
                        zPos += wave;
                        relY += waveY;
                    } else if (state.mode === 'music') {
                        // Audio Reactor radial beat pulse
                        const pulse = 1 + beat * 0.24 * (0.6 + this.energy * 0.6);
                        relX *= pulse;
                        relY *= pulse;
                        zPos += Math.sin(this.phase + time * 5) * beat * 65;
                    } else if (state.mode === 'galaxy') {
                        // Subtle spiral breathing
                        const swirl = Math.sin(time * 1.6 + this.phase) * 6;
                        relX += Math.cos(this.orbitAngle) * swirl;
                        relY += Math.sin(this.orbitAngle) * swirl;
                    } else {
                        zPos += Math.sin(time * 2.1 + this.phase + relX * 0.01) * 12;
                    }

                    // 3D Rotation Matrix (Y-axis & X-axis)
                    const cosY = Math.cos(tilt.x);
                    const sinY = Math.sin(tilt.x);
                    const cosX = Math.cos(tilt.y);
                    const sinX = Math.sin(tilt.y);

                    const rotX = relX * cosY - zPos * sinY;
                    const rotZ1 = zPos * cosY + relX * sinY;
                    const rotY = relY * cosX - rotZ1 * sinX;
                    const rotZ = rotZ1 * cosX + relY * sinX;

                    const fov = 780;
                    const scale = fov / (fov + rotZ);
                    const destX = cx + rotX * scale;
                    const destY = cy + rotY * scale;

                    // Spring Force with User-Controlled Tension
                    const k = this.baseSpring * state.springMultiplier;
                    this.vx += (destX - this.x) * k;
                    this.vy += (destY - this.y) * k;
                    this.vz += (rotZ - this.z) * k;

                    // Mode-Specific Ambient Physics (Curl Noise / Rising Embers)
                    if (state.mode === 'gold') {
                        // Molten Gold & Ember rising heat convection
                        const curl = curlNoise(this.x, this.y, time * 1.4);
                        this.vx += curl.vx * 0.015;
                        this.vy -= 0.14 * this.energy; // Rising thermal buoyancy
                    } else if (state.mode === 'supernova' || state.mode === 'galaxy') {
                        const curl = curlNoise(this.x, this.y, time);
                        this.vx += curl.vx * 0.008;
                        this.vy += curl.vy * 0.08;
                    }

                    // Interactive Mouse / Touch Physics Sandbox
                    if (mouse.active) {
                        const mdx = this.x - mouse.x;
                        const mdy = this.y - mouse.y;
                        const mDist = Math.hypot(mdx, mdy);

                        if (mDist < mouse.radius && mDist > 0.1) {
                            const ratio = 1 - mDist / mouse.radius;
                            if (state.forceMode === 'repel') {
                                // Explosive vortex push
                                const push = ratio * 11;
                                this.vx += (mdx / mDist) * push - (mdy / mDist) * ratio * 3.5;
                                this.vy += (mdy / mDist) * push + (mdx / mDist) * ratio * 3.5;
                                this.vz -= ratio * 18;
                            } else if (state.forceMode === 'attract') {
                                // Magnetic gravitational pull & orbit
                                const pull = ratio * 7.5;
                                this.vx -= (mdx / mDist) * pull + (mdy / mDist) * ratio * 4.2;
                                this.vy -= (mdy / mDist) * pull - (mdx / mDist) * ratio * 4.2;
                                this.vz += ratio * 12;
                            } else if (state.forceMode === 'laser') {
                                // High-energy scatter
                                this.vx += (Math.random() - 0.5) * ratio * 18;
                                this.vy += (Math.random() - 0.5) * ratio * 18;
                            }
                        }
                    }

                    // Matrix glyph mutation
                    if (state.mode === 'hologram' && Math.random() < 0.035) {
                        this.glyph = String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96));
                    }

                    this.prismAngle += 0.03;
                    this.vx *= this.friction;
                    this.vy *= this.friction;
                    this.vz *= this.friction;

                    this.x += this.vx;
                    this.y += this.vy;
                    this.z += this.vz;
                }

                draw(ctx) {
                    const fov = 780;
                    const depthScale = Math.max(0.32, fov / (fov + this.z));
                    const beatBoost = state.mode === 'music' ? (1 + state.audio.beatEnergy * 0.45) : 1;
                    const size = this.baseSize * depthScale * beatBoost;

                    ctx.fillStyle = this.color;

                    if (state.mode === 'hologram') {
                        // Digital Katakana & Binary Hologram Shards
                        ctx.font = `700 ${Math.max(8, Math.round(size * 4.4))}px "JetBrains Mono", monospace`;
                        ctx.fillText(this.glyph, this.x, this.y);
                    } else if (state.mode === 'crystal') {
                        // Refractive Diamond / Prism Shards
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.prismAngle);
                        ctx.beginPath();
                        ctx.moveTo(0, -size * 1.6);
                        ctx.lineTo(size * 1.1, 0);
                        ctx.lineTo(0, size * 1.6);
                        ctx.lineTo(-size * 1.1, 0);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    } else {
                        // Specular Luminous Core Particle
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // Foreground Volumetric Bokeh Light Orbs
            class BokehOrb {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * state.width;
                    this.y = Math.random() * state.height;
                    this.radius = Math.random() * 24 + 8;
                    this.vx = (Math.random() - 0.5) * 0.45;
                    this.vy = -Math.random() * 0.35 - 0.1;
                    this.alpha = Math.random() * 0.08 + 0.02;
                    const t = THEMES[state.theme];
                    this.color = Math.random() > 0.5 ? t.primary : t.secondary;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.y < -40) this.y = state.height + 40;
                    if (this.x < -40) this.x = state.width + 40;
                    if (this.x > state.width + 40) this.x = -40;
                }

                draw(ctx) {
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                    grad.addColorStop(0, this.color);
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.save();
                    ctx.globalAlpha = this.alpha * state.glowMultiplier;
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Interactive Shockwave Ring
            class Shockwave {
                constructor(x, y, color, maxR = null) {
                    this.x = x;
                    this.y = y;
                    this.radius = 8;
                    this.maxRadius = maxR || Math.max(state.width, state.height) * 0.52;
                    this.alpha = 0.85;
                    this.color = color;
                }

                update() {
                    this.radius += (this.maxRadius - this.radius) * 0.08;
                    this.alpha *= 0.92;
                }

                draw(ctx) {
                    if (this.alpha < 0.01) return;
                    ctx.save();
                    ctx.strokeStyle = this.color;
                    ctx.globalAlpha = this.alpha;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Sample Typography Pixels via Offscreen Canvas
            function buildTypography(rawText, triggerModeFX = true) {
                const cleanText = (rawText || 'BOTIROV').trim().toUpperCase();
                state.text = cleanText;
                state.scanProgress = 0;

                const offCanvas = document.createElement('canvas');
                const offCtx = offCanvas.getContext('2d');
                offCanvas.width = state.width;
                offCanvas.height = state.height;

                const maxTextWidth = state.width * 0.85;
                const baseFontSize = Math.min(state.width * 0.175, state.height * 0.25, 205);
                const useLuxurySerif = (state.mode === 'gold' || state.mode === 'crystal');
                const fontFamily = useLuxurySerif ? '"Cinzel", serif' : '"Space Grotesk", sans-serif';

                let fontSize = baseFontSize;
                offCtx.font = `900 ${fontSize}px ${fontFamily}`;
                let measured = offCtx.measureText(cleanText);

                if (measured.width > maxTextWidth) {
                    fontSize = Math.max(34, Math.floor(fontSize * (maxTextWidth / measured.width)));
                    offCtx.font = `900 ${fontSize}px ${fontFamily}`;
                    measured = offCtx.measureText(cleanText);
                }

                const centerX = state.width / 2;
                const centerY = state.height * 0.44;

                state.textMetrics = {
                    text: cleanText,
                    fontSize,
                    fontFamily,
                    centerX,
                    centerY,
                    width: measured.width
                };

                offCtx.fillStyle = '#ffffff';
                offCtx.textAlign = 'center';
                offCtx.textBaseline = 'middle';
                offCtx.fillText(cleanText, centerX, centerY);

                const imgData = offCtx.getImageData(0, 0, state.width, state.height).data;

                // Adaptive Sampling Step (up to 6,000+ particles on Ultra density)
                const isMobile = state.width < 640;
                let step = isMobile ? 4 : 4;
                if (state.densityLevel === 1) step = isMobile ? 6 : 6;
                if (state.densityLevel === 2) step = isMobile ? 4 : 4;
                if (state.densityLevel === 3) step = isMobile ? 3 : 3;

                const targets = [];
                for (let y = 0; y < state.height; y += step) {
                    for (let x = 0; x < state.width; x += step) {
                        const alpha = imgData[(y * state.width + x) * 4 + 3];
                        if (alpha > 135) {
                            const zDepth = (state.mode === 'crystal' || state.mode === 'hologram' || state.mode === 'gold')
                                ? (Math.random() - 0.5) * 34
                                : (Math.random() - 0.5) * 10;
                            targets.push({ x, y, z: zDepth });
                        }
                    }
                }

                // Cap max particles at 6,800 for rock-solid 60+ FPS
                if (targets.length > 6800) {
                    const stride = Math.ceil(targets.length / 6800);
                    const filtered = [];
                    for (let i = 0; i < targets.length; i += stride) filtered.push(targets[i]);
                    targets.length = 0;
                    targets.push(...filtered);
                }

                const curLen = state.particles.length;
                const newLen = targets.length;

                for (let i = 0; i < Math.min(curLen, newLen); i++) {
                    state.particles[i].targetX = targets[i].x;
                    state.particles[i].targetY = targets[i].y;
                    state.particles[i].targetZ = targets[i].z;
                    state.particles[i].assignColor(THEMES[state.theme], i);
                }

                if (newLen > curLen) {
                    for (let i = curLen; i < newLen; i++) {
                        state.particles.push(new VolumetricParticle(targets[i].x, targets[i].y, targets[i].z, i));
                    }
                } else {
                    state.particles.splice(newLen);
                }

                particleCountEl.textContent = state.particles.length.toLocaleString('uz-UZ');

                // Epic Mode-Specific Intro Burst
                if (triggerModeFX) {
                    if (state.mode === 'galaxy') {
                        // Black hole spiral swirl
                        state.particles.forEach((p, idx) => {
                            const a = idx * 0.05;
                            const r = 120 + (idx % 300);
                            p.x = centerX + Math.cos(a) * r;
                            p.y = centerY + Math.sin(a) * r;
                            p.vx = -Math.sin(a) * 28;
                            p.vy = Math.cos(a) * 28;
                        });
                    } else if (state.mode === 'supernova') {
                        // Big Bang implosion -> outward shockwave
                        state.particles.forEach(p => {
                            p.x = centerX + (Math.random() - 0.5) * 30;
                            p.y = centerY + (Math.random() - 0.5) * 30;
                            p.impulse(centerX, centerY, 34, false);
                        });
                    } else {
                        state.particles.forEach(p => p.impulse(centerX, centerY, 24, false));
                    }

                    state.shockwaves.push(new Shockwave(centerX, centerY, THEMES[state.theme].primary));
                    state.shockwaves.push(new Shockwave(centerX, centerY, THEMES[state.theme].secondary, state.width * 0.32));
                    audioEngine.playShockwaveBoom();
                }
            }

            // Volumetric Background, Neural Grid, Lightning Arcs & Chromatic Dispersion
            function renderVolumetricLayers() {
                const t = THEMES[state.theme];

                // Dynamic Motion Trail Decay
                const trailAlpha = state.mode === 'hologram' ? 0.22 : (state.mode === 'galaxy' ? 0.20 : 0.27);
                ctx.fillStyle = `rgba(3, 3, 6, ${trailAlpha})`;
                ctx.fillRect(0, 0, state.width, state.height);

                // 1. Deep Cosmic / Neural Perspective Grid (Cyber & Hologram Modes)
                if (state.mode === 'cyber' || state.mode === 'hologram') {
                    ctx.save();
                    ctx.strokeStyle = t.primary;
                    ctx.globalAlpha = 0.09 * state.glowMultiplier;
                    ctx.lineWidth = 1;

                    const horizonY = state.height * 0.67;
                    const cx = state.width / 2 + state.tilt.x * 220;

                    for (let i = -12; i <= 12; i++) {
                        ctx.beginPath();
                        ctx.moveTo(cx + i * 42, horizonY);
                        ctx.lineTo(cx + i * 260, state.height);
                        ctx.stroke();
                    }

                    const scroll = (state.time * 48) % 36;
                    for (let y = horizonY; y < state.height; y += 30) {
                        const py = y + scroll * ((y - horizonY) / (state.height - horizonY));
                        ctx.beginPath();
                        ctx.moveTo(0, py);
                        ctx.lineTo(state.width, py);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // 2. Galaxy Black Hole Accretion Disk Aura
                if (state.mode === 'galaxy') {
                    const cx = state.width / 2 + state.tilt.x * 60;
                    const cy = state.height * 0.44 + state.tilt.y * 60;
                    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.min(state.width, state.height) * 0.42);
                    grad.addColorStop(0, 'rgba(0,0,0,0.9)');
                    grad.addColorStop(0.25, t.glow);
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.save();
                    ctx.globalAlpha = 0.35 * state.glowMultiplier;
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cx, cy, Math.min(state.width, state.height) * 0.42, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // 3. Laser Sweep & Chromatic Aberration Outline
                if (state.textMetrics) {
                    state.scanProgress = Math.min(1, state.scanProgress + 0.016);
                    const m = state.textMetrics;
                    const tx = m.centerX + state.tilt.x * 55;
                    const ty = m.centerY + state.tilt.y * 55;

                    ctx.save();
                    ctx.translate(tx, ty);
                    ctx.font = `900 ${m.fontSize}px ${m.fontFamily}`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Chromatic Aberration Glitch Pulse in Cyber Mode
                    if (state.mode === 'cyber' && Math.random() < 0.08) {
                        const shift = (Math.random() - 0.5) * 14;
                        ctx.globalAlpha = 0.28;
                        ctx.strokeStyle = '#ff0055';
                        ctx.lineWidth = 2;
                        ctx.strokeText(m.text, shift, -2);
                        ctx.strokeStyle = '#00f0ff';
                        ctx.strokeText(m.text, -shift, 2);
                    }

                    // Primary Specular Halo Stroke
                    ctx.shadowColor = t.primary;
                    ctx.shadowBlur = 24 * state.glowMultiplier;
                    ctx.strokeStyle = t.secondary;
                    ctx.globalAlpha = (state.mode === 'cyber' ? 0.34 : 0.14) * state.scanProgress * state.glowMultiplier;
                    ctx.lineWidth = state.mode === 'cyber' ? 2 : 1.2;
                    ctx.strokeText(m.text, 0, 0);

                    // Holographic Laser Sweep Line
                    if (state.mode === 'hologram' && state.scanProgress < 0.99) {
                        const sweepY = -m.fontSize * 0.6 + state.scanProgress * (m.fontSize * 1.2);
                        ctx.strokeStyle = '#ffffff';
                        ctx.globalAlpha = 0.85;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(-m.width * 0.55, sweepY);
                        ctx.lineTo(m.width * 0.55, sweepY);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // 4. Electric Plasma Arcs & Crystal Constellation Lines
                if ((state.mode === 'cyber' || state.mode === 'crystal') && state.particles.length > 10) {
                    ctx.save();
                    ctx.strokeStyle = state.mode === 'cyber' ? t.secondary : t.primary;
                    ctx.lineWidth = state.mode === 'cyber' ? 0.9 : 0.65;
                    ctx.globalAlpha = (state.mode === 'cyber' ? 0.24 : 0.18) * state.glowMultiplier;
                    ctx.beginPath();

                    const step = Math.max(1, Math.floor(state.particles.length / 320));
                    const maxDist = state.mode === 'cyber' ? 48 : 42;
                    for (let i = 0; i < state.particles.length - step; i += step) {
                        const p1 = state.particles[i];
                        const p2 = state.particles[i + step];
                        const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                        if (d < maxDist) {
                            ctx.moveTo(p1.x, p1.y);
                            if (state.mode === 'cyber') {
                                // Jagged electric plasma midpoint
                                const mx = (p1.x + p2.x) * 0.5 + (Math.random() - 0.5) * 10;
                                const my = (p1.y + p2.y) * 0.5 + (Math.random() - 0.5) * 10;
                                ctx.lineTo(mx, my);
                            }
                            ctx.lineTo(p2.x, p2.y);
                        }
                    }
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Update Music Reactor Energy (Synthetic Beat or Live Mic)
            let lastBeatStep = -1;
            function updateAudioReactivity() {
                if (state.audio.useMic && state.audio.analyser && state.audio.micData) {
                    state.audio.analyser.getByteFrequencyData(state.audio.micData);
                    let sum = 0;
                    for (let i = 0; i < 16; i++) sum += state.audio.micData[i];
                    const norm = sum / (16 * 255);
                    state.audio.beatEnergy += (norm * 1.6 - state.audio.beatEnergy) * 0.25;
                } else if (state.mode === 'music') {
                    // Synthetic 128 BPM Electronic Beat Generator
                    const bpm = 128;
                    const beatPos = (state.time * (bpm / 60));
                    const step = Math.floor(beatPos);
                    const frac = beatPos - step;
                    if (step !== lastBeatStep) {
                        lastBeatStep = step;
                        audioEngine.playSynthKick();
                    }
                    state.audio.beatEnergy = Math.pow(1 - frac, 2.4);
                } else {
                    state.audio.beatEnergy *= 0.88;
                }

                beatLevelEl.textContent = `${Math.min(100, Math.round(state.audio.beatEnergy * 100))}%`;
            }

            // Main 60+ FPS Render Loop
            function animate(now) {
                requestAnimationFrame(animate);

                const dt = Math.min(0.05, (now - state.lastFrameTime) / 1000);
                state.lastFrameTime = now;
                state.time += dt;

                // FPS Counter Update
                state.frameCount++;
                state.fpsTimer += dt;
                if (state.fpsTimer >= 0.5) {
                    const fps = Math.min(60, Math.round(state.frameCount / state.fpsTimer));
                    fpsCounterEl.textContent = fps;
                    state.frameCount = 0;
                    state.fpsTimer = 0;
                }

                updateAudioReactivity();

                // Auto-Orbit or Smooth Mouse 3D Camera Tilt
                if (state.autoOrbitSpeed > 0) {
                    state.tilt.targetX = Math.sin(state.time * state.autoOrbitSpeed) * 0.42;
                    state.tilt.targetY = Math.cos(state.time * state.autoOrbitSpeed * 0.7) * 0.18;
                }
                state.tilt.x += (state.tilt.targetX - state.tilt.x) * 0.08;
                state.tilt.y += (state.tilt.targetY - state.tilt.y) * 0.08;

                // Render Volumetric Background & Outlines
                renderVolumetricLayers();

                // Render Foreground Bokeh Light Orbs
                for (let i = 0; i < state.bokehOrbs.length; i++) {
                    state.bokehOrbs[i].update();
                    state.bokehOrbs[i].draw(ctx);
                }

                // Additive Luminous Rendering for Particles, Plasma Trails & Shockwaves
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';

                for (let i = 0; i < state.particles.length; i++) {
                    const p = state.particles[i];
                    p.update(state.time, state.mouse, state.tilt, state.audio.beatEnergy);
                    p.draw(ctx);
                }

                // Shockwaves
                for (let i = state.shockwaves.length - 1; i >= 0; i--) {
                    const sw = state.shockwaves[i];
                    sw.update();
                    sw.draw(ctx);
                    if (sw.alpha < 0.01) state.shockwaves.splice(i, 1);
                }

                // Interactive Plasma Laser Trail
                if (state.plasmaTrail.length > 1) {
                    const t = THEMES[state.theme];
                    for (let i = 1; i < state.plasmaTrail.length; i++) {
                        const pt1 = state.plasmaTrail[i - 1];
                        const pt2 = state.plasmaTrail[i];
                        pt2.life -= dt * 2.2;
                        if (pt2.life > 0) {
                            ctx.strokeStyle = t.secondary;
                            ctx.shadowColor = t.primary;
                            ctx.shadowBlur = 16 * state.glowMultiplier;
                            ctx.globalAlpha = pt2.life;
                            ctx.lineWidth = pt2.life * 5;
                            ctx.beginPath();
                            ctx.moveTo(pt1.x, pt1.y);
                            ctx.lineTo(pt2.x, pt2.y);
                            ctx.stroke();
                        }
                    }
                    state.plasmaTrail = state.plasmaTrail.filter(pt => pt.life > 0);
                }

                // Interactive Cursor Magnetic Aura
                if (state.mouse.active) {
                    const t = THEMES[state.theme];
                    const grad = ctx.createRadialGradient(
                        state.mouse.x, state.mouse.y, 0,
                        state.mouse.x, state.mouse.y, state.mouse.radius
                    );
                    grad.addColorStop(0, t.glow);
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.globalAlpha = 0.7 * state.glowMultiplier;
                    ctx.beginPath();
                    ctx.arc(state.mouse.x, state.mouse.y, state.mouse.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // Responsive Canvas Resize
            function handleResize() {
                state.width = window.innerWidth;
                state.height = window.innerHeight;
                state.dpr = Math.min(window.devicePixelRatio || 1, 2);

                canvas.width = state.width * state.dpr;
                canvas.height = state.height * state.dpr;
                ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

                state.bokehOrbs = Array.from({ length: 24 }, () => new BokehOrb());
                buildTypography(state.text, true);
            }

            // Pointer & Touch Interactions
            function handlePointerMove(x, y) {
                state.mouse.x = x;
                state.mouse.y = y;
                state.mouse.active = true;

                if (state.forceMode === 'laser') {
                    state.plasmaTrail.push({ x, y, life: 1.0 });
                }

                if (state.autoOrbitSpeed === 0) {
                    const nx = (x / state.width - 0.5) * 2;
                    const ny = (y / state.height - 0.5) * 2;
                    state.tilt.targetX = nx * 0.32;
                    state.tilt.targetY = -ny * 0.24;
                }
            }

            function triggerCanvasClick(x, y) {
                handlePointerMove(x, y);
                const inward = state.forceMode === 'attract';
                state.particles.forEach(p => p.impulse(x, y, 28, inward));
                state.shockwaves.push(new Shockwave(x, y, THEMES[state.theme].secondary));
                audioEngine.playShockwaveBoom();
            }

            canvas.addEventListener('mousemove', e => handlePointerMove(e.clientX, e.clientY));
            canvas.addEventListener('mouseleave', () => {
                state.mouse.active = false;
                if (state.autoOrbitSpeed === 0) {
                    state.tilt.targetX = 0;
                    state.tilt.targetY = 0;
                }
            });
            canvas.addEventListener('mousedown', e => triggerCanvasClick(e.clientX, e.clientY));

            canvas.addEventListener('touchstart', e => {
                if (e.touches.length > 0) {
                    triggerCanvasClick(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            canvas.addEventListener('touchmove', e => {
                if (e.touches.length > 0) {
                    handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            canvas.addEventListener('touchend', () => {
                state.mouse.active = false;
            });

            // Live Instant Morphing on Typing + Form Submit
            let typingDebounce = null;
            nameInput.addEventListener('input', () => {
                clearTimeout(typingDebounce);
                typingDebounce = setTimeout(() => {
                    const val = nameInput.value.trim();
                    if (val.length > 0) {
                        buildTypography(val, false);
                        audioEngine.playMorphChime();
                    }
                }, 140);
            });

            nameForm.addEventListener('submit', e => {
                e.preventDefault();
                const val = nameInput.value.trim();
                if (!val) {
                    showToast("Iltimos, ism yoki matn kiriting!");
                    nameInput.focus();
                    return;
                }
                buildTypography(val, true);
                showToast(`"${val.toUpperCase()}" — Supernova yaratildi!`);
            });

            // Quick Preset Chips
            document.querySelectorAll('.preset-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const word = chip.dataset.chip;
                    nameInput.value = word;
                    buildTypography(word, true);
                    showToast(`"${word}" yuklandi!`);
                });
            });

            // 8 Animation Mode Buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const selected = btn.dataset.mode;
                    state.mode = selected;

                    document.querySelectorAll('.mode-btn').forEach(b => {
                        const active = b.dataset.mode === selected;
                        b.classList.toggle('active', active);
                        b.classList.toggle('text-white/75', !active);
                    });

                    // Smart theme pairing for iconic modes
                    if (selected === 'gold') applyTheme('gold');
                    if (selected === 'cyber') applyTheme('cyber');
                    if (selected === 'hologram') applyTheme('emerald');
                    if (selected === 'galaxy') applyTheme('royal');
                    if (selected === 'supernova') applyTheme('supernova');
                    if (selected === 'crystal') applyTheme('ice');

                    buildTypography(nameInput.value || state.text, true);
                });
            });

            // Color Palette Buttons
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    audioEngine.playMorphChime();
                    applyTheme(btn.dataset.theme);
                });
            });

            // Mouse Force Mode Buttons
            document.querySelectorAll('.force-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    audioEngine.playMorphChime();
                    state.forceMode = btn.dataset.force;
                    document.querySelectorAll('.force-btn').forEach(b => {
                        const active = b.dataset.force === state.forceMode;
                        b.classList.toggle('active', active);
                        b.classList.toggle('text-white/70', !active);
                    });
                });
            });

            // Audio Source Buttons (Synth Beat vs Live Mic)
            synthBeatBtn.addEventListener('click', () => {
                state.audio.useMic = false;
                synthBeatBtn.classList.add('active');
                micReactBtn.classList.remove('active');
                showToast("Sintezator Beat rejimi tanlandi");
            });

            micReactBtn.addEventListener('click', () => {
                micReactBtn.classList.add('active');
                synthBeatBtn.classList.remove('active');
                audioEngine.enableMicrophone();
            });

            // Physics Sliders
            densitySlider.addEventListener('input', () => {
                state.densityLevel = parseInt(densitySlider.value, 10);
                const labels = { 1: "O'rtacha", 2: 'Yuqori', 3: 'Ultra 6K+' };
                densityVal.textContent = labels[state.densityLevel];
                buildTypography(state.text, false);
            });

            springSlider.addEventListener('input', () => {
                state.springMultiplier = parseFloat(springSlider.value);
                springVal.textContent = `${state.springMultiplier.toFixed(1)}x`;
            });

            glowSlider.addEventListener('input', () => {
                state.glowMultiplier = parseFloat(glowSlider.value);
                glowVal.textContent = `${Math.round(state.glowMultiplier * 100)}%`;
            });

            orbitSlider.addEventListener('input', () => {
                state.autoOrbitSpeed = parseFloat(orbitSlider.value);
                orbitVal.textContent = state.autoOrbitSpeed === 0 ? "O'chiq" : `${state.autoOrbitSpeed.toFixed(1)}x`;
            });

            // Studio Sandbox Drawer Toggle
            function setSandboxOpen(open) {
                state.sandboxOpen = open;
                studioDrawer.classList.toggle('translate-x-[120%]', !open);
                studioDrawer.classList.toggle('opacity-0', !open);
                studioDrawer.classList.toggle('pointer-events-none', !open);
            }

            toggleSandboxBtn.addEventListener('click', () => setSandboxOpen(!state.sandboxOpen));
            closeSandboxBtn.addEventListener('click', () => setSandboxOpen(false));

            // Sound Mute/Unmute Toggle
            soundToggleBtn.addEventListener('click', () => {
                state.audio.enabled = !state.audio.enabled;
                soundIconOn.classList.toggle('hidden', !state.audio.enabled);
                soundIconOff.classList.toggle('hidden', state.audio.enabled);
                if (state.audio.enabled) audioEngine.playMorphChime();

            // 4K PNG Screenshot with Watermark
            screenshotBtn.addEventListener('click', () => {
                audioEngine.playMorphChime();
                try {
                    const exportCanvas = document.createElement('canvas');
                    exportCanvas.width = canvas.width;
                    exportCanvas.height = canvas.height;
                    const eCtx = exportCanvas.getContext('2d');
                    eCtx.drawImage(canvas, 0, 0);

                    // Subtle Luxury Studio Watermark
                    eCtx.save();
                    eCtx.font = `700 ${Math.max(14, Math.round(exportCanvas.width * 0.011))}px "Space Grotesk", sans-serif`;
                    eCtx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                    eCtx.textAlign = 'right';
                    eCtx.fillText('BOTIROV ANIMATSIYA // STUDIO EDITION', exportCanvas.width - 36, exportCanvas.height - 28);
                    eCtx.restore();

                    const link = document.createElement('a');
                    const safeName = (state.text || 'BOTIROV').replace(/[^a-zA-Z0-9_-]/g, '_');
                    link.download = `${safeName}_4K_BOTIROV_STUDIO.png`;
                    link.href = exportCanvas.toDataURL('image/png', 1.0);
                    link.click();
                    showToast("4K PNG rasm muvaffaqiyatli yuklab olindi!");
                } catch (err) {
                    showToast("Rasmni eksport qilishda xatolik.");
                }
            });

            // 5-Second WebM Video Recorder (MediaRecorder API)
            recordVideoBtn.addEventListener('click', () => {
                if (state.isRecording) return;
                if (typeof MediaRecorder === 'undefined' || !canvas.captureStream) {
                    showToast("Brauzeringiz video yozishni qo'llab-quvvatlamaydi.");
                    return;
                }

                try {
                    state.isRecording = true;
                    recIndicator.classList.add('rec-dot');
                    recBtnLabel.textContent = 'Yozilmoqda (5s)...';
                    showToast("5 soniyalik WebM video yozish boshlandi...");

                    // Trigger fresh explosion at start of video
                    buildTypography(state.text, true);

                    const stream = canvas.captureStream(60);
                    const mimeTypes = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
                    const selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';

                    const recorder = new MediaRecorder(stream, {
                        mimeType: selectedMime,
                        videoBitsPerSecond: 8000000
                    });

                    const chunks = [];
                    recorder.ondataavailable = e => {
                        if (e.data && e.data.size > 0) chunks.push(e.data);
                    };

                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: selectedMime });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        const safeName = (state.text || 'BOTIROV').replace(/[^a-zA-Z0-9_-]/g, '_');
                        a.href = url;
                        a.download = `${safeName}_BOTIROV_ANIMATSIYA.webm`;
                        a.click();
                        URL.revokeObjectURL(url);

                        state.isRecording = false;
                        recIndicator.classList.remove('rec-dot');
                        recBtnLabel.textContent = 'WebM Video';
                        showToast("WebM video tayyor va yuklab olindi!");
                    };

                    recorder.start();
                    setTimeout(() => {
                        if (recorder.state === 'recording') recorder.stop();
                    }, 5000);
                } catch (err) {
                    state.isRecording = false;
                    recIndicator.classList.remove('rec-dot');
                    recBtnLabel.textContent = 'WebM Video';
                    showToast("Video yozishda xatolik yuz berdi.");
                }
            });

            // Cinema Mode Toggle (Hides all UI for pure full-screen presentation)
            function toggleCinemaMode() {
                state.cinemaMode = !state.cinemaMode;
                topHeader.classList.toggle('-translate-y-28', state.cinemaMode);
                topHeader.classList.toggle('opacity-0', state.cinemaMode);
                bottomDeck.classList.toggle('translate-y-48', state.cinemaMode);
                bottomDeck.classList.toggle('opacity-0', state.cinemaMode);
                bottomDeck.classList.toggle('pointer-events-none', state.cinemaMode);
                if (state.cinemaMode) setSandboxOpen(false);

                eyeOpenIcon.classList.toggle('hidden', state.cinemaMode);
                eyeClosedIcon.classList.toggle('hidden', !state.cinemaMode);

                if (state.cinemaMode) {
                    showToast("Kinoteatr rejimi: Qaytish uchun 'H' tugmasini bosing");
                }
            }

            cinemaModeBtn.addEventListener('click', toggleCinemaMode);
            window.addEventListener('keydown', e => {
                if (document.activeElement === nameInput) return;
                if (e.key.toLowerCase() === 'h') {
                    toggleCinemaMode();
                }
            });

            // Launch Epic Intro Sequence on Window Load
            window.addEventListener('resize', handleResize);
            window.onload = () => {
                applyTheme('gold');
                handleResize();
                requestAnimationFrame(animate);
            };
        })();
    </script>
</body>
</html>
